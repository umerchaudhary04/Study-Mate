name: studymate
description: A Smart Study Planner Flutter Application for students.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Icons & UI Utilities
  cupertino_icons: ^1.0.6
  intl: ^0.19.0                      # Date & Time formatting

  # Local Persistence (Question 2 Requirement)
  shared_preferences: ^2.2.3

  # Cloud Persistence (Question 2 Requirement)
  firebase_core: ^2.32.0
  cloud_firestore: ^4.17.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true